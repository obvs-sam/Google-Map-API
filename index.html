<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Admin Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- 1. MODERN PROFESSIONAL VARIABLES --- */
        :root {
            --bg-body: #f3f4f6;       /* Light Grey Background */
            --bg-card: #ffffff;       /* Pure White Cards */
            --primary: #4f46e5;       /* Indigo for primary actions */
            --primary-hover: #4338ca;
            --text-dark: #111827;     /* Almost Black for Headings */
            --text-light: #6b7280;    /* Grey for secondary text */
            --border-color: #e5e7eb;  /* Subtle borders */
            
            --success-bg: #dcfce7;
            --success-text: #166534;
            
            --danger-bg: #fee2e2;
            --danger-text: #991b1b;

            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * { box-sizing: border-box; outline: none; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-dark);
            margin: 0; padding: 40px 20px;
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        /* --- HEADER --- */
        .header-section { margin-bottom: 40px; text-align: left; }
        .header-title { font-size: 2rem; font-weight: 700; color: var(--text-dark); margin: 0; }
        .header-subtitle { color: var(--text-light); margin-top: 5px; font-size: 0.95rem; }

        /* --- STATS CARDS --- */
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; margin-bottom: 32px;
        }

        .stat-card {
            background: var(--bg-card); padding: 24px; border-radius: 16px;
            box-shadow: var(--shadow-sm); border: 1px solid var(--border-color);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex; flex-direction: column;
        }
        
        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .stat-label { font-size: 0.875rem; font-weight: 500; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-value { font-size: 2.5rem; font-weight: 700; color: var(--text-dark); margin-top: 8px; }
        
        /* Indicators */
        .indicator { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }

        /* --- CONTROLS --- */
        .controls-wrapper {
            background: var(--bg-card); padding: 16px; border-radius: 12px;
            box-shadow: var(--shadow-sm); border: 1px solid var(--border-color);
            display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center;
            margin-bottom: 24px;
        }

        .search-box { flex: 1; min-width: 300px; position: relative; }
        .search-box input {
            width: 100%; padding: 12px 16px; padding-left: 44px;
            border: 1px solid var(--border-color); border-radius: 8px;
            font-size: 0.95rem; font-family: 'Inter', sans-serif;
            transition: all 0.2s; color: var(--text-dark);
        }
        .search-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-light); font-size: 1.1rem; }

        .filter-group { display: flex; gap: 8px; background: #f9fafb; padding: 4px; border-radius: 8px; border: 1px solid var(--border-color); }
        .filter-btn {
            padding: 8px 16px; border: none; background: transparent; cursor: pointer;
            border-radius: 6px; font-weight: 500; font-size: 0.875rem; color: var(--text-light);
            transition: all 0.2s;
        }
        .filter-btn:hover { color: var(--text-dark); background: rgba(0,0,0,0.05); }
        .filter-btn.active { background: var(--bg-card); color: var(--primary); box-shadow: var(--shadow-sm); font-weight: 600; }

        /* --- TABLE --- */
        .table-container {
            background: var(--bg-card); border-radius: 16px; overflow: hidden;
            box-shadow: var(--shadow-md); border: 1px solid var(--border-color);
        }
        table { width: 100%; border-collapse: collapse; }
        
        thead { background: #f9fafb; border-bottom: 1px solid var(--border-color); }
        th { padding: 16px 24px; text-align: left; font-size: 0.75rem; font-weight: 600; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px; }
        
        td { padding: 20px 24px; border-bottom: 1px solid var(--border-color); font-size: 0.95rem; color: var(--text-dark); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: #f9fafb; }

        /* --- BADGES & BUTTONS --- */
        .badge {
            display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 9999px;
            font-size: 0.75rem; font-weight: 600;
        }
        .badge-active { background-color: var(--success-bg); color: var(--success-text); }
        .badge-restricted { background-color: var(--danger-bg); color: var(--danger-text); }
        
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 8px 16px; border-radius: 8px; font-size: 0.875rem; font-weight: 500;
            cursor: pointer; border: 1px solid transparent; transition: all 0.2s; gap: 8px;
        }
        
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
        
        .btn-outline { background-color: white; border-color: var(--border-color); color: var(--text-dark); }
        .btn-outline:hover { background-color: #f9fafb; border-color: #d1d5db; }

        /* Action Buttons Specific Colors */
        .btn-action-lock { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .btn-action-lock:hover { background-color: #fecaca; }

        .btn-action-unlock { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .btn-action-unlock:hover { background-color: #bbf7d0; }

        /* --- MODAL --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px);
            z-index: 1000; justify-content: center; align-items: center;
            animation: fadeIn 0.2s ease-out;
        }
        
        .modal-card {
            background: var(--bg-card); width: 95%; max-width: 650px; height: 90vh;
            border-radius: 16px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column;
            animation: slideUp 0.3s ease-out; overflow: hidden;
        }

        .modal-header {
            padding: 20px 24px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; background: #fff;
        }
        .modal-title { font-size: 1.1rem; font-weight: 600; color: var(--text-dark); margin: 0; }
        .close-btn { background: none; border: none; font-size: 1.5rem; color: var(--text-light); cursor: pointer; transition: color 0.2s; }
        .close-btn:hover { color: var(--text-dark); }

        .modal-body { padding: 24px; overflow-y: auto; background: #f9fafb; flex: 1; }

        /* INFO SECTIONS */
        .info-section { background: #fff; border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow-sm); }
        .section-heading { 
            font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; 
            color: var(--text-light); margin-bottom: 16px; border-bottom: 1px solid #f3f4f6; padding-bottom: 8px;
        }

        .info-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.9rem; }
        .info-label { color: var(--text-light); }
        .info-val { font-weight: 500; color: var(--text-dark); text-align: right; }

        /* MAP BUTTON STYLE */
        .map-btn-modern {
            display: flex; align-items: center; justify-content: center; width: 100%;
            padding: 12px; background-color: #eff6ff; color: #1d4ed8; 
            border: 1px solid #bfdbfe; border-radius: 8px; font-weight: 600; text-decoration: none;
            transition: all 0.2s; gap: 8px; margin-top: 5px;
        }
        .map-btn-modern:hover { background-color: #dbeafe; transform: translateY(-1px); }

        /* SWITCHES STYLE */
        .switch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .switch-badge {
            display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 6px;
            font-size: 0.8rem; font-weight: 500; background: #f3f4f6; color: var(--text-light);
        }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; }
        .status-on { background-color: #22c55e; }
        .status-off { background-color: #ef4444; }
        .text-on { color: #15803d; background: #dcfce7; }
        .text-off { color: #991b1b; background: #fee2e2; }

        /* EMI Table inside Modal */
        .emi-table { width: 100%; font-size: 0.85rem; border-collapse: collapse; margin-top: 10px; }
        .emi-table th { text-align: left; padding: 8px; color: var(--text-light); border-bottom: 1px solid var(--border-color); font-weight: 500; }
        .emi-table td { padding: 8px; border-bottom: 1px solid #f3f4f6; color: var(--text-dark); }
        .emi-paid { color: #166534; font-weight: 600; }
        .emi-pending { color: #991b1b; font-weight: 600; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    </style>
</head>
<body>

    <div class="container">
        
        <div class="header-section">
            <h1 class="header-title">Dashboard</h1>
            <p class="header-subtitle">Manage device restrictions and view customer insights.</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label"><span class="indicator" style="background:#6366f1;"></span>Total Devices</span>
                <span class="stat-value" id="totalCount">Loading...</span>
            </div>
            <div class="stat-card">
                <span class="stat-label"><span class="indicator" style="background:#ef4444;"></span>Restricted</span>
                <span class="stat-value" id="lockedCount" style="color:#ef4444;">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label"><span class="indicator" style="background:#22c55e;"></span>Active</span>
                <span class="stat-value" id="unlockedCount" style="color:#22c55e;">0</span>
            </div>
        </div>

        <div class="controls-wrapper">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" onkeyup="applyFilters()" placeholder="Search by name, ID or phone...">
            </div>
            <div class="filter-group">
                <button class="filter-btn active" onclick="setFilter('all', this)">All Devices</button>
                <button class="filter-btn" onclick="setFilter('locked', this)">Restricted</button>
                <button class="filter-btn" onclick="setFilter('active', this)">Active</button>
            </div>
        </div>

        <div class="table-container">
            <table id="deviceTable">
                <thead>
                    <tr>
                        <th width="30%">Device ID / User</th>
                        <th width="20%">Status</th>
                        <th width="50%" style="text-align:right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr><td colspan="3" style="text-align:center; padding:60px; color:#9ca3af;">Connecting to secure server...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="infoModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h2 class="modal-title">Device Intelligence</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modalBodyContent">
                </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3_9rThlE6buWnVV7R292DYd9B0wgLJBI",
            authDomain: "divyanshglobal-ecommerce.firebaseapp.com",
            databaseURL: "https://divyanshglobal-ecommerce-default-rtdb.firebaseio.com",
            projectId: "divyanshglobal-ecommerce",
            storageBucket: "divyanshglobal-ecommerce.firebasestorage.app",
            messagingSenderId: "588680943243",
            appId: "1:588680943243:web:21d29cddde8274173f268e",
            measurementId: "G-ZDEM4XHEBV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const DB_PATH_NAME = 'device'; 

        window.currentStatusFilter = 'all';

        // --- FETCH USER INFO ---
        window.fetchUserInfo = async function(deviceId) {
            const modal = document.getElementById('infoModal');
            const content = document.getElementById('modalBodyContent');
            
            modal.style.display = 'flex';
            content.innerHTML = `<div style="text-align:center; padding:80px 0; color:#6b7280;">
                                    <div style="font-size:2rem; margin-bottom:10px;">⏳</div>
                                    <div>Retrieving Data...</div>
                                 </div>`;

            try {
                const apiUrl = `https://login.emitrackon.in/api/get/hidden_app/send-device-info/${deviceId}`;
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error("Connection failed");

                const rawData = await response.json();
                if (!rawData || !rawData.customer) throw new Error("No data available");

                const c = rawData.customer; 
                const r = c.retailer || {};
                const b = c.bank || {};
                const act = c.action || {};

                // Parse Device Specs
                let dSpecs = {};
                try { dSpecs = JSON.parse(c.device_detail || '{}'); } catch (e) {}

                // --- 📍 SMART MAP LOGIC (Clean Address) ---
                let mapQuery = "";
                let displayAddress = "Map View";
                
                // Priority 1: Exact GPS
                if (c.latitude && c.longitude) {
                    mapQuery = `${c.latitude},${c.longitude}`;
                } 
                // Priority 2: Address String Manipulation (Remove first 4 words)
                else if (r.address) {
                    let rawAddr = r.address;
                    let words = rawAddr.split(' ');
                    if (words.length > 4) {
                        mapQuery = encodeURIComponent(words.slice(4).join(' '));
                    } else {
                        mapQuery = encodeURIComponent(rawAddr);
                    }
                }
                
                const mapLink = `https://www.google.com/maps/search/?api=1&query=${mapQuery}`;
                // --------------------------------------------------------

                let html = `
                    <div class="info-section">
                        <div class="section-heading">Customer Profile</div>
                        <div class="info-row"><span class="info-label">Name</span> <span class="info-val">${c.name || 'N/A'}</span></div>
                        <div class="info-row"><span class="info-label">Phone</span> <span class="info-val">${c.phone || 'N/A'}</span></div>
                        <div class="info-row"><span class="info-label">Loan ID</span> <span class="info-val">${c.subscription_id || '-'}</span></div>
                        <div class="info-row"><span class="info-label">Bill No</span> <span class="info-val">${c.bill_no || '-'}</span></div>
                    </div>

                    <div class="info-section">
                        <div class="section-heading">Location Tracking</div>
                        <a href="${mapLink}" target="_blank" class="map-btn-modern">
                            <span style="font-size:1.1rem;">🗺️</span> View Nearby on Google Maps
                        </a>
                    </div>

                    <div class="info-section">
                        <div class="section-heading">Financial Details</div>
                        <div class="info-row"><span class="info-label">Product Price</span> <span class="info-val">₹${c.product_price || 0}</span></div>
                        <div class="info-row"><span class="info-label">EMI Amount</span> <span class="info-val" style="color:var(--primary); font-weight:700;">₹${c.emi_amount || 0}</span></div>
                        <div class="info-row"><span class="info-label">Financer</span> <span class="info-val">${b.name || '-'}</span></div>
                    </div>

                    <div class="info-section">
                        <div class="section-heading">Security Policies</div>
                        <div class="switch-grid">`;
                
                for (const [key, item] of Object.entries(act)) {
                    let isOn = item.value === true;
                    let badgeClass = isOn ? 'text-on' : 'text-off';
                    let dotClass = isOn ? 'status-on' : 'status-off';
                    html += `
                        <div class="switch-badge ${badgeClass}">
                            <div class="status-dot ${dotClass}"></div>
                            ${item.display}
                        </div>
                    `;
                }
                html += `</div></div>`;

                html += `<div class="info-section">
                            <div class="section-heading">Device Hardware</div>
                            <div class="info-row"><span class="info-label">Model</span> <span class="info-val">${dSpecs.Model || c.model}</span></div>
                            <div class="info-row"><span class="info-label">IMEI</span> <span class="info-val">${c.imei1 || '-'}</span></div>
                         </div>`;

                html += `
                    <div class="info-section">
                        <div class="section-heading">Repayment Schedule</div>
                        <table class="emi-table">
                            <thead>
                                <tr><th>Date</th><th>Amount</th><th style="text-align:right;">Status</th></tr>
                            </thead>
                            <tbody>`;
                
                if (c.emi && Array.isArray(c.emi)) {
                    c.emi.forEach(e => {
                        let statusClass = e.status === 'Paid' ? 'emi-paid' : 'emi-pending';
                        html += `<tr>
                            <td>${e.pay_on_date}</td>
                            <td>₹${e.amount}</td>
                            <td style="text-align:right;"><span class="${statusClass}">${e.status}</span></td>
                        </tr>`;
                    });
                } else { html += `<tr><td colspan="3" style="text-align:center; padding:10px;">No records found</td></tr>`; }
                
                html += `</tbody></table></div>`;

                content.innerHTML = html;

            } catch (error) {
                console.error(error);
                content.innerHTML = `<div style="text-align:center; color:#ef4444; padding:40px;"><h3>Unable to load data</h3><p>${error.message}</p></div>`;
            }
        }

        window.closeModal = function() { document.getElementById('infoModal').style.display = 'none'; }
        window.onclick = function(e) { if (e.target == document.getElementById('infoModal')) closeModal(); }
        
        window.setFilter = function(s, b) {
            window.currentStatusFilter = s;
            document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            applyFilters();
        }

        window.applyFilters = function() {
            let val = document.getElementById("searchInput").value.toUpperCase();
            let trs = document.getElementById("deviceTable").getElementsByTagName("tr");
            for (let tr of trs) {
                let td = tr.getElementsByTagName("td")[0];
                if (td) {
                    let txt = td.innerText.toUpperCase();
                    let stat = tr.getAttribute('data-status');
                    let show = (window.currentStatusFilter === 'all' || window.currentStatusFilter === stat) && txt.indexOf(val) > -1;
                    tr.style.display = show ? "" : "none";
                }
            }
        }

        window.toggleStatus = function(id, current) {
            let next = !current;
            let action = next ? "Activate Restriction" : "Remove Restriction";
            if(confirm(`Are you sure you want to ${action} for Device ${id}?`)) {
                update(ref(db, DB_PATH_NAME + '/' + id), { isActiveRestriction: next }).catch(e => alert(e.message));
            }
        };

        function startMonitor() {
            onValue(ref(db, DB_PATH_NAME), (snap) => {
                if (snap.exists()) {
                    let tot=0, lck=0, unl=0, h="";
                    snap.forEach(c => {
                        tot++;
                        let d = c.val(), id = c.key;
                        let isRes = d.isActiveRestriction === true;
                        if(isRes) lck++; else unl++;
                        
                        let badgeClass = isRes ? "badge-restricted" : "badge-active";
                        let bTxt = isRes ? "Restricted" : "Active";
                        
                        let btnCls = isRes ? "btn-action-unlock" : "btn-action-lock";
                        let btnTxt = isRes ? "Deactivate" : "Activate"; 
                        let btnIcon = isRes ? "🔓" : "🛡️";
                        let tag = isRes ? "locked" : "active";

                        h += `<tr data-status="${tag}">
                            <td>
                                <div style="font-weight:600; color:var(--text-dark);">${id}</div>
                                <div style="font-size:0.8rem; color:var(--text-light);">Device ID</div>
                            </td>
                            <td><span class="badge ${badgeClass}">${bTxt}</span></td>
                            <td style="text-align:right;">
                                <button class="btn btn-outline" onclick="window.fetchUserInfo('${id}')">View Info</button>
                                <button class="btn ${btnCls}" onclick="window.toggleStatus('${id}', ${isRes})">${btnIcon} ${btnTxt}</button>
                            </td>
                        </tr>`;
                    });
                    document.getElementById("totalCount").innerText = tot;
                    document.getElementById("lockedCount").innerText = lck;
                    document.getElementById("unlockedCount").innerText = unl;
                    document.getElementById("userTableBody").innerHTML = h;
                    applyFilters();
                } else {
                    document.getElementById("userTableBody").innerHTML = "<tr><td colspan='3' style='text-align:center; padding:40px;'>No devices found in database.</td></tr>";
                }
            });
        }
        startMonitor();
    </script>
</body>
</html>
