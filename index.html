<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Admin Pro | Ultimate Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- 1. SUPERIOR VARIABLES & RESET --- */
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #6366f1; /* Indigo Neon */
            --accent: #0ea5e9;  /* Sky Blue */
            --success: #10b981; /* Emerald */
            --danger: #ef4444;  /* Red */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(14, 165, 233, 0.15) 0%, transparent 20%);
            margin: 0;
            padding: 40px 20px;
            color: var(--text-main);
            min-height: 100vh;
        }

        /* --- 2. CONTAINER & HEADER --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-title {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 40px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* --- 3. GLASS CARDS (STATS) --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            opacity: 0.7;
        }

        .glass-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-color: rgba(255,255,255,0.2);
        }

        .glass-card h3 {
            color: var(--text-muted);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 0;
        }

        .glass-card p {
            font-size: 3.5rem;
            font-weight: 700;
            margin: 10px 0 0;
            line-height: 1;
        }

        .txt-neon-blue { text-shadow: 0 0 20px rgba(99, 102, 241, 0.5); color: #818cf8; }
        .txt-neon-red { text-shadow: 0 0 20px rgba(239, 68, 68, 0.5); color: #f87171; }
        .txt-neon-green { text-shadow: 0 0 20px rgba(16, 185, 129, 0.5); color: #34d399; }

        /* --- 4. CONTROLS (SEARCH & FILTER) --- */
        .controls-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: rgba(30, 41, 59, 0.4);
            padding: 15px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
        }

        .search-box {
            flex: 1;
            min-width: 300px;
            position: relative;
        }

        #searchInput {
            width: 100%;
            padding: 16px 20px;
            padding-left: 50px; /* Space for icon */
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(15, 23, 42, 0.6);
            color: white;
            font-size: 1rem;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s;
        }
        
        #searchInput::placeholder { color: #64748b; }
        #searchInput:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }

        /* Search Icon Pseudo-element */
        .search-box::after {
            content: '🔍';
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.5;
            font-size: 18px;
        }

        .filter-group {
            display: flex;
            background: rgba(15, 23, 42, 0.6);
            padding: 5px;
            border-radius: 12px;
            gap: 5px;
        }

        .filter-btn {
            padding: 10px 24px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 600;
            color: var(--text-muted);
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s ease;
        }

        .filter-btn:hover { color: white; }

        .filter-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        /* --- 5. DATA TABLE (THE HERO) --- */
        .table-container {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        thead {
            background: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        th {
            padding: 20px 30px;
            text-align: left;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 600;
        }

        td {
            padding: 20px 30px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 1rem;
            color: var(--text-main);
        }

        tbody tr {
            transition: background 0.2s;
            animation: fadeIn 0.5s ease forwards;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        /* --- 6. BADGES & ACTIONS --- */
        .badge {
            padding: 8px 16px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .badge-locked {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .badge-open {
            background: rgba(16, 185, 129, 0.15);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        /* Pulsing Dot */
        .dot {
            height: 8px; width: 8px; border-radius: 50%;
        }
        .badge-open .dot { background: #34d399; box-shadow: 0 0 8px #34d399; }
        .badge-locked .dot { background: #f87171; box-shadow: 0 0 8px #f87171; }

        button.btn {
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-lock {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
        }
        .btn-lock:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.5);
        }

        .btn-unlock {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }
        .btn-unlock:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.5);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <div class="container">
        <h2 class="header-title">⚡ EMI Admin Pro Dashboard</h2>

        <div class="stats-grid">
            <div class="glass-card">
                <h3>Total Users</h3>
                <p id="totalCount" class="txt-neon-blue">Loading...</p>
            </div>
            <div class="glass-card">
                <h3>🚫 Locked Devices</h3>
                <p id="lockedCount" class="txt-neon-red">0</p>
            </div>
            <div class="glass-card">
                <h3>✅ Active Devices</h3>
                <p id="unlockedCount" class="txt-neon-green">0</p>
            </div>
        </div>

        <div class="controls-wrapper">
            <div class="search-box">
                <input type="text" id="searchInput" onkeyup="applyFilters()" placeholder="Search Device ID or Name...">
            </div>
            
            <div class="filter-group">
                <button class="filter-btn active" onclick="setFilter('all', this)">All Devices</button>
                <button class="filter-btn" onclick="setFilter('locked', this)">Locked 🔒</button>
                <button class="filter-btn" onclick="setFilter('active', this)">Active ✅</button>
            </div>
        </div>

        <div class="table-container">
            <table id="deviceTable">
                <thead>
                    <tr>
                        <th width="40%">Device ID / User</th>
                        <th width="30%">Status</th>
                        <th width="30%">Action</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr><td colspan="3" style="text-align:center; padding: 40px; color: var(--text-muted);">⚡ Connecting to Neural Network...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // CONFIG (NO CHANGE)
        const firebaseConfig = {
            apiKey: "AIzaSyC3_9rThlE6buWnVV7R292DYd9B0wgLJBI",
            authDomain: "divyanshglobal-ecommerce.firebaseapp.com",
            databaseURL: "https://divyanshglobal-ecommerce-default-rtdb.firebaseio.com",
            projectId: "divyanshglobal-ecommerce",
            storageBucket: "divyanshglobal-ecommerce.firebasestorage.app",
            messagingSenderId: "588680943243",
            appId: "1:588680943243:web:21d29cddde8274173f268e",
            measurementId: "G-ZDEM4XHEBV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const DB_PATH_NAME = 'device'; 

        window.currentStatusFilter = 'all';

        // FILTER BUTTON CLICK
        window.setFilter = function(status, btnElement) {
            window.currentStatusFilter = status;
            let buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            applyFilters();
        }

        // FILTER LOGIC
        window.applyFilters = function() {
            var input, filterText, table, tr, tdId, i, txtValue;
            input = document.getElementById("searchInput");
            filterText = input.value.toUpperCase();
            table = document.getElementById("deviceTable");
            tr = table.getElementsByTagName("tr");

            for (i = 0; i < tr.length; i++) {
                tdId = tr[i].getElementsByTagName("td")[0];
                if (tdId) {
                    txtValue = tdId.textContent || tdId.innerText;
                    let textMatch = txtValue.toUpperCase().indexOf(filterText) > -1;
                    let rowStatus = tr[i].getAttribute('data-status'); 
                    let statusMatch = (window.currentStatusFilter === 'all') || (window.currentStatusFilter === rowStatus);

                    if (textMatch && statusMatch) {
                        tr[i].style.display = "";
                    } else {
                        tr[i].style.display = "none";
                    }
                }
            }
        }

        // TOGGLE STATUS
        window.toggleStatus = function(deviceId, currentStatus) {
            const newStatus = !currentStatus; 
            const actionName = newStatus ? "LOCK 🔒" : "UNLOCK 🔓";
            
            if(confirm(`Confirm Action: ${actionName} for Device ${deviceId}?`)) {
                const deviceRef = ref(db, DB_PATH_NAME + '/' + deviceId);
                update(deviceRef, {
                    isActiveRestriction: newStatus
                }).catch((error) => {
                    alert("Error: " + error.message);
                });
            }
        };

        // MONITOR DATA
        function startMonitor() {
            const devicesRef = ref(db, DB_PATH_NAME);

            onValue(devicesRef, (snapshot) => {
                if (snapshot.exists()) {
                    let total = 0;
                    let locked = 0;
                    let unlocked = 0;
                    let htmlCode = "";

                    snapshot.forEach((childSnapshot) => {
                        total++;
                        const userId = childSnapshot.key;
                        const data = childSnapshot.val();
                        const isRestricted = data.isActiveRestriction === true; 

                        if (isRestricted) locked++; else unlocked++;

                        // Modern Badge Logic
                        const badgeClass = isRestricted ? "badge-locked" : "badge-open";
                        const badgeText = isRestricted ? "LOCKED" : "ACTIVE";
                        
                        // Modern Button Logic
                        const btnClass = isRestricted ? "btn-unlock" : "btn-lock";
                        const btnIcon = isRestricted ? "🔓" : "🛡️";
                        const btnText = isRestricted ? "Unlock Device" : "Lock Device";
                        
                        const statusTag = isRestricted ? "locked" : "active";

                        htmlCode += `
                            <tr data-status="${statusTag}">
                                <td>
                                    <div style="font-weight:600; color:#fff; font-size:1.1rem;">${userId}</div>
                                    <div style="font-size:0.8rem; color:#64748b;">Android ID</div>
                                </td>
                                <td>
                                    <span class="badge ${badgeClass}">
                                        <div class="dot"></div> ${badgeText}
                                    </span>
                                </td>
                                <td>
                                    <button class="btn ${btnClass}" onclick="window.toggleStatus('${userId}', ${isRestricted})">
                                        ${btnIcon} ${btnText}
                                    </button>
                                </td>
                            </tr>
                        `;
                    });

                    document.getElementById("totalCount").innerText = total;
                    document.getElementById("lockedCount").innerText = locked;
                    document.getElementById("unlockedCount").innerText = unlocked;
                    document.getElementById("userTableBody").innerHTML = htmlCode;
                    applyFilters(); 

                } else {
                    document.getElementById("totalCount").innerText = "0";
                    document.getElementById("userTableBody").innerHTML = "<tr><td colspan='3' style='text-align:center; padding:30px; color:#94a3b8;'>No Devices Connected</td></tr>";
                }
            });
        }

        startMonitor();
    </script>
</body>
</html>
