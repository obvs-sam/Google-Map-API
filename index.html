<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EMI Admin Pro | Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        /* --- CSS VARIABLES --- */
        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-card-hover: rgba(255, 255, 255, 0.06);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #6b6b80;
            --accent-primary: #6366f1;
            --accent-secondary: #8b5cf6;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.3);
            --danger: #ef4444;
            --danger-glow: rgba(239, 68, 68, 0.3);
            --warning: #f59e0b;
            --warning-glow: rgba(245, 158, 11, 0.3);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 20px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.5);
            --shadow-glow: 0 0 40px rgba(99, 102, 241, 0.15);
        }

        /* --- RESET & BASE --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(139, 92, 246, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(168, 85, 247, 0.05) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1500px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* --- HEADER --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            margin-bottom: 25px;
            box-shadow: var(--shadow-glow);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-icon {
            width: 50px;
            height: 50px;
            background: var(--accent-gradient);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
            animation: pulse-glow 3s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4); }
            50% { box-shadow: 0 4px 30px rgba(99, 102, 241, 0.6); }
        }

        .brand-text h1 {
            font-size: 1.4rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .brand-text span {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 30px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .header-status span {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--success);
        }

        /* --- STATS GRID --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 25px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent-gradient);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: var(--shadow-glow);
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .stat-card.danger::before { background: linear-gradient(90deg, #ef4444, #f87171); }
        .stat-card.warning::before { background: linear-gradient(90deg, #f59e0b, #fbbf24); }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .stat-card:nth-child(1) .stat-icon {
            background: rgba(99, 102, 241, 0.15);
            color: var(--accent-primary);
        }

        .stat-card:nth-child(2) .stat-icon {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
        }

        .stat-card:nth-child(3) .stat-icon {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #fff 0%, #a0a0b0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-card:nth-child(2) .stat-value {
            background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .stat-card:nth-child(3) .stat-value {
            background: linear-gradient(135deg, #ef4444 0%, #f87171 100%);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .stat-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- FILTER SECTION --- */
        .filter-section {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px 25px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .filter-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filter-title i {
            color: var(--accent-primary);
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group-label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-group-btns {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            padding: 10px 18px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .filter-btn:hover {
            background: rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.3);
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: var(--accent-gradient);
            border-color: transparent;
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .filter-actions {
            display: flex;
            gap: 10px;
            margin-left: auto;
        }

        .btn-clear {
            padding: 10px 18px;
            border-radius: 12px;
            border: 1px solid rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-clear:hover {
            background: rgba(239, 68, 68, 0.2);
            transform: translateY(-2px);
        }

        .btn-export {
            padding: 10px 20px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-export:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
        }

        .filter-badge {
            padding: 8px 16px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-primary);
            display: none;
            align-items: center;
            gap: 6px;
        }

        /* --- SEARCH BOX --- */
        .search-container {
            position: relative;
            margin-bottom: 25px;
        }

        .search-container i {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
        }

        .search-box {
            width: 100%;
            padding: 18px 20px 18px 55px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s;
        }

        .search-box::placeholder {
            color: var(--text-muted);
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        /* --- TABLE CARD --- */
        .table-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            overflow: hidden;
        }

        .table-scroll {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: rgba(255, 255, 255, 0.02);
        }

        th {
            padding: 18px 20px;
            text-align: left;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--glass-border);
        }

        tbody tr {
            transition: all 0.3s;
        }

        tbody tr:hover {
            background: rgba(99, 102, 241, 0.05);
        }

        td {
            padding: 20px;
            border-bottom: 1px solid var(--glass-border);
            vertical-align: middle;
        }

        .device-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .device-id {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            font-family: 'SF Mono', 'Fira Code', monospace;
        }

        .device-copy {
            font-size: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: color 0.2s;
        }

        .device-copy:hover {
            color: var(--accent-primary);
        }

        /* Status Badges */
        .status-badges {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            width: fit-content;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .badge-success .badge-dot {
            background: var(--success);
            box-shadow: 0 0 8px var(--success-glow);
        }

        .badge-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .badge-danger .badge-dot {
            background: var(--danger);
            box-shadow: 0 0 8px var(--danger-glow);
        }

        /* Control Panel */
        .control-panel {
            display: flex;
            gap: 15px;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-label {
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .control-btns {
            display: flex;
            gap: 6px;
        }

        .ctrl-btn {
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .ctrl-btn:hover {
            transform: translateY(-2px);
        }

        .ctrl-btn.apply {
            border-color: rgba(245, 158, 11, 0.3);
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
        }

        .ctrl-btn.apply:hover {
            background: rgba(245, 158, 11, 0.2);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.2);
        }

        .ctrl-btn.remove {
            border-color: rgba(16, 185, 129, 0.3);
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .ctrl-btn.remove:hover {
            background: rgba(16, 185, 129, 0.2);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .ctrl-btn.lock {
            border-color: rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        .ctrl-btn.lock:hover {
            background: rgba(239, 68, 68, 0.2);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }

        .ctrl-btn.unlock {
            border-color: rgba(16, 185, 129, 0.3);
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
        }

        .ctrl-btn.unlock:hover {
            background: rgba(16, 185, 129, 0.2);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .ctrl-btn.info {
            border-color: rgba(99, 102, 241, 0.3);
            background: rgba(99, 102, 241, 0.1);
            color: var(--accent-primary);
        }

        .ctrl-btn.info:hover {
            background: rgba(99, 102, 241, 0.2);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        /* Pagination */
        .pagination {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--glass-border);
        }

        .page-btn {
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .page-btn:hover {
            background: rgba(99, 102, 241, 0.1);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
            transform: translateY(-2px);
        }

        .page-info {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .page-info span {
            color: var(--accent-primary);
        }

        /* --- MODAL --- */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-box {
            background: var(--bg-secondary);
            border: 1px solid var(--glass-border);
            width: 100%;
            max-width: 550px;
            max-height: 90vh;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            animation: modalIn 0.3s ease-out;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-header {
            padding: 20px 25px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 1.2rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: transparent;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.3);
            color: var(--danger);
        }

        .modal-body {
            padding: 25px;
            overflow-y: auto;
            max-height: calc(90vh - 80px);
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .info-item {
            background: var(--bg-card);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }

        .info-item label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .info-item span {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .map-container {
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 15px;
            border: 1px solid var(--glass-border);
        }

        .map-container iframe {
            width: 100%;
            height: 200px;
            border: none;
        }

        .map-link {
            display: block;
            padding: 14px;
            background: var(--accent-gradient);
            color: white;
            text-align: center;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .map-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state i {
            font-size: 3rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .empty-state p {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--glass-border);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* --- MOBILE RESPONSIVE --- */
        @media (max-width: 1100px) {
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 900px) {
            .container { padding: 15px; }
            
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .filter-section {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-actions {
                margin-left: 0;
                flex-direction: column;
            }

            .filter-group-btns {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            .filter-btn {
                justify-content: center;
            }

            thead { display: none; }

            tbody tr {
                display: block;
                padding: 20px;
                margin-bottom: 15px;
                background: var(--bg-card);
                border-radius: 16px;
                border: 1px solid var(--glass-border);
            }

            td {
                display: block;
                padding: 10px 0;
                border: none;
            }

            td:first-child {
                padding-bottom: 15px;
                margin-bottom: 15px;
                border-bottom: 1px solid var(--glass-border);
            }

            .control-panel {
                flex-direction: column;
            }

            .control-group {
                width: 100%;
            }

            .control-btns {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            .ctrl-btn {
                justify-content: center;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <header class="header">
            <div class="brand">
                <div class="brand-icon">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div class="brand-text">
                    <h1>EMI ADMIN PRO</h1>
                    <span>Device Management System</span>
                </div>
            </div>
            <div class="header-status">
                <div class="status-dot"></div>
                <span id="dbStatus">Connecting...</span>
            </div>
        </header>

        <!-- STATS -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">
                    <i class="fa-solid fa-mobile-screen"></i>
                </div>
                <div class="stat-value" id="cntTotal">--</div>
                <div class="stat-label">Total Devices</div>
            </div>
            <div class="stat-card warning">
                <div class="stat-icon">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div class="stat-value" id="cntRes">0</div>
                <div class="stat-label">Policy Restricted</div>
            </div>
            <div class="stat-card danger">
                <div class="stat-icon">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <div class="stat-value" id="cntLock">0</div>
                <div class="stat-label">Screen Locked</div>
            </div>
        </div>

        <!-- FILTERS -->
        <div class="filter-section">
            <div class="filter-title">
                <i class="fa-solid fa-sliders"></i>
                Filters
            </div>

            <div class="filter-group">
                <span class="filter-group-label">Screen Lock</span>
                <div class="filter-group-btns">
                    <button id="filterUnlocked" class="filter-btn" onclick="app.setFilter('screen', 'unlocked')">
                        <i class="fa-solid fa-lock-open"></i> Unlocked
                    </button>
                    <button id="filterLocked" class="filter-btn" onclick="app.setFilter('screen', 'locked')">
                        <i class="fa-solid fa-lock"></i> Locked
                    </button>
                </div>
            </div>

            <div class="filter-group">
                <span class="filter-group-label">Restriction</span>
                <div class="filter-group-btns">
                    <button id="filterResOn" class="filter-btn" onclick="app.setFilter('restriction', 'on')">
                        <i class="fa-solid fa-shield-halved"></i> ON
                    </button>
                    <button id="filterResOff" class="filter-btn" onclick="app.setFilter('restriction', 'off')">
                        <i class="fa-regular fa-circle-check"></i> OFF
                    </button>
                </div>
            </div>

            <div class="filter-actions">
                <button class="btn-clear" onclick="app.clearFilters()">
                    <i class="fa-solid fa-xmark"></i> Clear
                </button>
                <button class="btn-export" onclick="app.exportToExcel()">
                    <i class="fa-solid fa-file-excel"></i> Export
                </button>
            </div>

            <div id="activeFilterBadge" class="filter-badge">
                <i class="fa-solid fa-check"></i>
                <span id="filterCountText">0 results</span>
            </div>
        </div>

        <!-- SEARCH -->
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchBox" class="search-box" placeholder="Search by Device ID..." onkeyup="app.handleSearch()">
        </div>

        <!-- TABLE -->
        <div class="table-card">
            <div class="table-scroll">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th>Device ID</th>
                            <th>Status</th>
                            <th>Control Panel</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="3">
                                <div class="loading">
                                    <div class="spinner"></div>
                                    <p>Loading devices...</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination">
                <button class="page-btn" onclick="app.changePage(-1)">
                    <i class="fa-solid fa-chevron-left"></i> Previous
                </button>
                <div class="page-info">Page <span id="pgNum">1</span></div>
                <button class="page-btn" onclick="app.changePage(1)">
                    Next <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div id="infoModal" class="modal">
        <div class="modal-box">
            <div class="modal-header">
                <h3><i class="fa-solid fa-circle-info"></i> Device Details</h3>
                <button class="modal-close" onclick="document.getElementById('infoModal').style.display='none'">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="modalBody" class="modal-body"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
  apiKey: "AIzaSyCXWbB9WDAIaJL_4OWmDA0Z27o4ydCo8AA",
  authDomain: "mdmapp-2b5f7.firebaseapp.com",
  databaseURL: "https://mdmapp-2b5f7-default-rtdb.firebaseio.com",
  projectId: "mdmapp-2b5f7",
  storageBucket: "mdmapp-2b5f7.firebasestorage.app",
  messagingSenderId: "836031113994",
  appId: "1:836031113994:web:7b4ca9f65666983d2c28f3",
  measurementId: "G-CKB4VFER8M"
};

        const db = getDatabase(initializeApp(firebaseConfig));

        class App {
            constructor() {
                this.mainData = {};
                this.lockData = {};
                this.mergedList = [];
                this.displayData = [];
                this.currentPage = 1;
                this.rowsPerPage = 10;
                this.searchTerm = '';
                this.filters = {
                    screen: null,
                    restriction: null
                };
            }

            init() {
                onValue(ref(db, 'device'), (snap) => {
                    this.mainData = snap.val() || {};
                    this.combineAndRender();
                });

                onValue(ref(db, 'devices'), (snap) => {
                    this.lockData = snap.val() || {};
                    this.combineAndRender();
                });
            }

            combineAndRender() {
                const ids = Object.keys(this.mainData);
                
                this.mergedList = ids.map(id => {
                    const mainObj = this.mainData[id] || {};
                    const lockObj = this.lockData[id] || {};
                    
                    return {
                        id: id,
                        isActiveRestriction: mainObj.isActiveRestriction === true,
                        isLock: lockObj.isLock === true
                    };
                }).reverse();

                document.getElementById('cntTotal').innerText = this.mergedList.length;
                document.getElementById('cntRes').innerText = this.mergedList.filter(d => d.isActiveRestriction).length;
                document.getElementById('cntLock').innerText = this.mergedList.filter(d => d.isLock).length;
                document.getElementById('dbStatus').innerText = `Live • ${this.mergedList.length} Devices`;

                this.applyLogic();
            }

            handleSearch() {
                this.searchTerm = document.getElementById('searchBox').value.toLowerCase();
                this.currentPage = 1;
                this.applyLogic();
            }

            setFilter(filterType, value) {
                if (this.filters[filterType] === value) {
                    this.filters[filterType] = null;
                } else {
                    this.filters[filterType] = value;
                }
                this.currentPage = 1;
                this.updateFilterUI();
                this.applyLogic();
            }

            clearFilters() {
                this.filters.screen = null;
                this.filters.restriction = null;
                this.currentPage = 1;
                this.updateFilterUI();
                this.applyLogic();
            }

            updateFilterUI() {
                document.getElementById('filterUnlocked').classList.toggle('active', this.filters.screen === 'unlocked');
                document.getElementById('filterLocked').classList.toggle('active', this.filters.screen === 'locked');
                document.getElementById('filterResOn').classList.toggle('active', this.filters.restriction === 'on');
                document.getElementById('filterResOff').classList.toggle('active', this.filters.restriction === 'off');
                
                const anyFilterActive = this.filters.screen !== null || this.filters.restriction !== null;
                document.getElementById('activeFilterBadge').style.display = anyFilterActive ? 'inline-flex' : 'none';
            }

            applyLogic() {
                let data = this.mergedList;
                
                if (this.searchTerm) {
                    data = data.filter(d => d.id.toLowerCase().includes(this.searchTerm));
                }
                
                if (this.filters.screen === 'unlocked') {
                    data = data.filter(d => !d.isLock);
                } else if (this.filters.screen === 'locked') {
                    data = data.filter(d => d.isLock);
                }
                
                if (this.filters.restriction === 'on') {
                    data = data.filter(d => d.isActiveRestriction);
                } else if (this.filters.restriction === 'off') {
                    data = data.filter(d => !d.isActiveRestriction);
                }
                
                this.displayData = data;
                
                if (this.filters.screen !== null || this.filters.restriction !== null) {
                    document.getElementById('filterCountText').innerText = `${data.length} results`;
                }
                
                this.renderTable();
            }

            renderTable() {
                const total = this.displayData.length;
                
                if (total === 0) {
                    document.getElementById('tableBody').innerHTML = `
                        <tr>
                            <td colspan="3">
                                <div class="empty-state">
                                    <i class="fa-regular fa-folder-open"></i>
                                    <p>No devices found</p>
                                </div>
                            </td>
                        </tr>`;
                    document.getElementById('pgNum').innerText = '0 / 0';
                    return;
                }

                const pages = Math.ceil(total / this.rowsPerPage);
                if (this.currentPage > pages) this.currentPage = pages;
                if (this.currentPage < 1) this.currentPage = 1;
                
                const start = (this.currentPage - 1) * this.rowsPerPage;
                const pageData = this.displayData.slice(start, start + this.rowsPerPage);
                document.getElementById('pgNum').innerText = `${this.currentPage} / ${pages}`;

                document.getElementById('tableBody').innerHTML = pageData.map(d => `
                    <tr>
                        <td>
                            <div class="device-info">
                                <span class="device-id">${d.id}</span>
                                <span class="device-copy" onclick="app.copy('${d.id}')">
                                    <i class="fa-regular fa-copy"></i> Copy ID
                                </span>
                            </div>
                        </td>
                        
                        <td>
                            <div class="status-badges">
                                <div class="badge ${d.isActiveRestriction ? 'badge-danger' : 'badge-success'}">
                                    <span class="badge-dot"></span>
                                    Restriction: ${d.isActiveRestriction ? 'ON' : 'OFF'}
                                </div>
                                <div class="badge ${d.isLock ? 'badge-danger' : 'badge-success'}">
                                    <span class="badge-dot"></span>
                                    Screen: ${d.isLock ? 'LOCKED' : 'UNLOCKED'}
                                </div>
                            </div>
                        </td>

                        <td>
                            <div class="control-panel">
                                <div class="control-group">
                                    <span class="control-label">Policy</span>
                                    <div class="control-btns">
                                        <button class="ctrl-btn apply" onclick="app.setRestriction('${d.id}', true)">
                                            <i class="fa-solid fa-shield-halved"></i> Apply
                                        </button>
                                        <button class="ctrl-btn remove" onclick="app.setRestriction('${d.id}', false)">
                                            <i class="fa-regular fa-circle-check"></i> Remove
                                        </button>
                                    </div>
                                </div>

                                <div class="control-group">
                                    <span class="control-label">Screen</span>
                                    <div class="control-btns">
                                        <button class="ctrl-btn lock" onclick="app.setLock('${d.id}', true)">
                                            <i class="fa-solid fa-lock"></i> Lock
                                        </button>
                                        <button class="ctrl-btn unlock" onclick="app.setLock('${d.id}', false)">
                                            <i class="fa-solid fa-lock-open"></i> Unlock
                                        </button>
                                    </div>
                                </div>

                                <div class="control-group">
                                    <span class="control-label">Info</span>
                                    <div class="control-btns">
                                        <button class="ctrl-btn info" onclick="app.showInfo('${d.id}')">
                                            <i class="fa-solid fa-eye"></i> View
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                `).join('');
            }

            changePage(d) {
                this.currentPage += d;
                this.renderTable();
            }

            copy(t) {
                navigator.clipboard.writeText(t);
                // Could add a toast notification here
            }

            setRestriction(id, val) {
                if (confirm(`${val ? 'Apply' : 'Remove'} restriction for ${id}?`)) {
                    update(ref(db, `device/${id}`), { isActiveRestriction: val })
                        .catch(e => alert(e.message));
                }
            }

            setLock(id, val) {
                if (confirm(`${val ? 'Lock' : 'Unlock'} screen for ${id}?`)) {
                    update(ref(db, `devices/${id}`), { isLock: val })
                        .catch(e => alert(e.message));
                }
            }

            async showInfo(id) {
                const m = document.getElementById('infoModal');
                const b = document.getElementById('modalBody');
                m.style.display = 'flex';
                b.innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Loading details...</p>
                    </div>`;

                try {
                    const res = await fetch(`https://login.emitrackon.in/api/get/hidden_app/send-device-info/${id}`);
                    const json = await res.json();
                    const c = json.customer;
                    const r = c.retailer || {};

                    let mapUrl = "";
                    if (c.latitude && c.longitude) {
                        mapUrl = `https://maps.google.com/maps?q=${c.latitude},${c.longitude}&z=15&output=embed`;
                    } else if (r.address) {
                        mapUrl = `https://maps.google.com/maps?q=${encodeURIComponent(r.address)}&z=15&output=embed`;
                    }

                    b.innerHTML = `
                        <div class="info-grid">
                            <div class="info-item">
                                <label>Name</label>
                                <span>${c.name || 'N/A'}</span>
                            </div>
                            <div class="info-item">
                                <label>Phone</label>
                                <span>${c.phone || 'N/A'}</span>
                            </div>
                            <div class="info-item">
                                <label>EMI Amount</label>
                                <span>₹${c.emi_amount || 'N/A'}</span>
                            </div>
                            <div class="info-item">
                                <label>Loan ID</label>
                                <span>${c.subscription_id || 'N/A'}</span>
                            </div>
                        </div>
                        ${mapUrl ? `
                            <div class="map-container">
                                <iframe src="${mapUrl}"></iframe>
                            </div>
                            <a href="${mapUrl.replace('&output=embed', '')}" target="_blank" class="map-link">
                                <i class="fa-solid fa-map-location-dot"></i> Open in Google Maps
                            </a>
                        ` : '<p style="text-align:center; color:var(--text-muted);">No location available</p>'}
                    `;
                } catch (e) {
                    b.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            <p>Failed to load device info</p>
                        </div>`;
                }
            }

            exportToExcel() {
                if (this.displayData.length === 0) {
                    alert('No data to export!');
                    return;
                }

                const excelData = this.displayData.map((d, index) => ({
                    'S.No': index + 1,
                    'Device ID': d.id,
                    'Screen Lock': d.isLock ? 'LOCKED' : 'UNLOCKED',
                    'Restriction': d.isActiveRestriction ? 'ON' : 'OFF'
                }));

                const wb = XLSX.utils.book_new();
                const ws = XLSX.utils.json_to_sheet(excelData);

                ws['!cols'] = [
                    { wch: 8 },
                    { wch: 40 },
                    { wch: 15 },
                    { wch: 15 }
                ];

                XLSX.utils.book_append_sheet(wb, ws, 'Devices');

                let filterInfo = [];
                if (this.filters.screen) filterInfo.push(`Screen-${this.filters.screen}`);
                if (this.filters.restriction) filterInfo.push(`Restriction-${this.filters.restriction}`);
                
                const timestamp = new Date().toISOString().slice(0, 10);
                const filterSuffix = filterInfo.length > 0 ? `_${filterInfo.join('_')}` : '_All';
                const filename = `EMI_Devices${filterSuffix}_${timestamp}.xlsx`;

                XLSX.writeFile(wb, filename);
            }
        }

        window.app = new App();
        app.init();

        // Close modal on outside click
        document.getElementById('infoModal').addEventListener('click', function(e) {
            if (e.target === this) this.style.display = 'none';
        });
    </script>
</body>
</html>
