<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Admin Pro | Restriction Manager</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- 1. SUPERIOR VARIABLES & RESET --- */
        :root {
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #6366f1; /* Indigo Neon */
            --accent: #0ea5e9;  /* Sky Blue */
            --success: #10b981; /* Emerald */
            --danger: #ef4444;  /* Red */
            --info: #3b82f6;    /* Blue for Info */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(14, 165, 233, 0.15) 0%, transparent 20%);
            margin: 0;
            padding: 40px 20px;
            color: var(--text-main);
            min-height: 100vh;
        }

        /* --- 2. CONTAINER & HEADER --- */
        .container { max-width: 1200px; margin: 0 auto; }

        .header-title {
            text-align: center;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 40px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* --- 3. GLASS CARDS (STATS) --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .glass-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .glass-card h3 { color: var(--text-muted); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.5px; margin: 0; }
        .glass-card p { font-size: 3.5rem; font-weight: 700; margin: 10px 0 0; line-height: 1; }
        .txt-neon-blue { text-shadow: 0 0 20px rgba(99, 102, 241, 0.5); color: #818cf8; }
        .txt-neon-red { text-shadow: 0 0 20px rgba(239, 68, 68, 0.5); color: #f87171; }
        .txt-neon-green { text-shadow: 0 0 20px rgba(16, 185, 129, 0.5); color: #34d399; }

        /* --- 4. CONTROLS --- */
        .controls-wrapper {
            display: flex; flex-wrap: wrap; gap: 20px; justify-content: space-between; align-items: center;
            margin-bottom: 25px; background: rgba(30, 41, 59, 0.4); padding: 15px;
            border-radius: 16px; border: 1px solid var(--glass-border);
        }
        .search-box { flex: 1; min-width: 300px; position: relative; }
        #searchInput {
            width: 100%; padding: 16px 20px; padding-left: 50px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1); background: rgba(15, 23, 42, 0.6);
            color: white; font-size: 1rem; font-family: 'Outfit', sans-serif;
        }
        .search-box::after { content: '🔍'; position: absolute; left: 18px; top: 50%; transform: translateY(-50%); opacity: 0.5; }
        .filter-group { display: flex; background: rgba(15, 23, 42, 0.6); padding: 5px; border-radius: 12px; gap: 5px; }
        .filter-btn { padding: 10px 24px; border: none; background: transparent; cursor: pointer; border-radius: 8px; font-weight: 600; color: var(--text-muted); transition: all 0.3s; }
        .filter-btn:hover { color: white; }
        .filter-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }

        /* --- 5. DATA TABLE --- */
        .table-container {
            background: var(--card-bg); backdrop-filter: blur(15px); border: 1px solid var(--glass-border);
            border-radius: 24px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        thead { background: rgba(15, 23, 42, 0.8); border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { padding: 20px 30px; text-align: left; font-size: 0.85rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
        td { padding: 20px 30px; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 1rem; color: var(--text-main); }
        tbody tr:hover { background: rgba(255, 255, 255, 0.03); }

        /* --- 6. BUTTONS & BADGES --- */
        .badge { padding: 6px 14px; border-radius: 50px; font-size: 0.75rem; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
        .badge-locked { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-open { background: rgba(16, 185, 129, 0.15); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }
        .dot { height: 8px; width: 8px; border-radius: 50%; }
        .badge-open .dot { background: #34d399; box-shadow: 0 0 8px #34d399; }
        .badge-locked .dot { background: #f87171; box-shadow: 0 0 8px #f87171; }

        button.btn {
            border: none; padding: 10px 18px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.85rem;
            display: inline-flex; align-items: center; gap: 6px; margin-right: 5px; transition: all 0.2s;
        }
        .btn-lock { background: #ef4444; color: white; }
        .btn-unlock { background: #10b981; color: white; }
        .btn-info { background: #3b82f6; color: white; box-shadow: 0 0 10px rgba(59, 130, 246, 0.3); }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

        /* --- 7. MODAL (POPUP) STYLES --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px);
            z-index: 1000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: #1e293b; width: 90%; max-width: 550px;
            border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 0 50px rgba(99, 102, 241, 0.2); overflow: hidden;
            animation: slideUp 0.3s ease;
        }
        .modal-header {
            background: linear-gradient(90deg, #6366f1, #0ea5e9);
            padding: 20px; color: white; display: flex; justify-content: space-between; align-items: center;
        }
        .modal-header h3 { margin: 0; font-size: 1.2rem; }
        .close-btn { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        .modal-body { padding: 25px; max-height: 70vh; overflow-y: auto; }
        
        /* Modal Data Rows */
        .data-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .data-label { color: #94a3b8; font-size: 0.9rem; }
        .data-value { color: #f8fafc; font-weight: 600; text-align: right; }
        
        /* Section Titles in Modal */
        .section-title {
            color: var(--primary); font-size: 0.95rem; font-weight: 700;
            margin: 25px 0 10px 0; border-left: 3px solid var(--accent);
            padding-left: 10px; text-transform: uppercase; letter-spacing: 0.5px;
        }

        /* EMI Table Styles */
        .emi-table-wrapper {
            margin-top: 10px; background: rgba(0,0,0,0.2); border-radius: 12px;
            padding: 10px; max-height: 200px; overflow-y: auto;
        }
        .mini-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .mini-table th { text-align: left; color: #94a3b8; padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .mini-table td { padding: 8px; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .status-paid { color: #4ade80; font-weight: bold; background: rgba(74, 222, 128, 0.1); padding: 2px 8px; border-radius: 4px; }
        .status-unpaid { color: #f87171; font-weight: bold; background: rgba(248, 113, 113, 0.1); padding: 2px 8px; border-radius: 4px; }

        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    </style>
</head>
<body>

    <div class="container">
        <h2 class="header-title">⚡ EMI Admin Pro Dashboard</h2>

        <div class="stats-grid">
            <div class="glass-card">
                <h3>Total Users</h3>
                <p id="totalCount" class="txt-neon-blue">...</p>
            </div>
            <div class="glass-card">
                <h3>🛡️ Activate-Restriction</h3>
                <p id="lockedCount" class="txt-neon-red">0</p>
            </div>
            <div class="glass-card">
                <h3>🔓 Deactivate-Restriction</h3>
                <p id="unlockedCount" class="txt-neon-green">0</p>
            </div>
        </div>

        <div class="controls-wrapper">
            <div class="search-box">
                <input type="text" id="searchInput" onkeyup="applyFilters()" placeholder="Search Device ID...">
            </div>
            <div class="filter-group">
                <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
                <button class="filter-btn" onclick="setFilter('locked', this)">🛡️ Activate-Restriction</button>
                <button class="filter-btn" onclick="setFilter('active', this)">🔓 Deactivate-Restriction</button>
            </div>
        </div>

        <div class="table-container">
            <table id="deviceTable">
                <thead>
                    <tr>
                        <th width="35%">Device ID</th>
                        <th width="25%">Status</th>
                        <th width="40%">Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr><td colspan="3" style="text-align:center; padding: 40px;">⚡ Connecting to Database...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="infoModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Device Details</h3>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modalBodyContent">
                </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyC3_9rThlE6buWnVV7R292DYd9B0wgLJBI",
            authDomain: "divyanshglobal-ecommerce.firebaseapp.com",
            databaseURL: "https://divyanshglobal-ecommerce-default-rtdb.firebaseio.com",
            projectId: "divyanshglobal-ecommerce",
            storageBucket: "divyanshglobal-ecommerce.firebasestorage.app",
            messagingSenderId: "588680943243",
            appId: "1:588680943243:web:21d29cddde8274173f268e",
            measurementId: "G-ZDEM4XHEBV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const DB_PATH_NAME = 'device'; 

        window.currentStatusFilter = 'all';

        // --- 1. COMPLEX API FETCH & PARSING LOGIC ---
        window.fetchUserInfo = async function(deviceId) {
            const modal = document.getElementById('infoModal');
            const content = document.getElementById('modalBodyContent');
            const title = document.getElementById('modalTitle');

            // Show Loading
            modal.style.display = 'flex';
            title.innerText = `ID: ${deviceId}`;
            content.innerHTML = `<div style="text-align:center; padding:40px; color:#94a3b8;">
                                    <div style="font-size:2.5rem; animation:pulse 1s infinite;">📡</div>
                                    <br>Fetching Secure Data...
                                 </div>`;

            try {
                // API HIT
                const apiUrl = `https://login.emitrackon.in/api/get/hidden_app/send-device-info/${deviceId}`;
                const response = await fetch(apiUrl);
                
                if (!response.ok) throw new Error("Server Error");

                const rawData = await response.json();
                
                // DATA VALIDATION
                if (!rawData || !rawData.customer) {
                    throw new Error("No Customer Data Found");
                }

                const cust = rawData.customer; 
                const retailer = cust.retailer || {};
                const bank = cust.bank || {};
                
                // PARSE DEVICE DETAIL STRING
                let deviceSpecs = {};
                try {
                    deviceSpecs = JSON.parse(cust.device_detail || '{}');
                } catch (e) { console.log("Device detail parse error"); }

                // BUILD HTML
                let html = `
                    <div class="section-title">👤 Customer Details</div>
                    <div class="data-row"><span class="data-label">Name</span> <span class="data-value">${cust.name || 'N/A'}</span></div>
                    <div class="data-row"><span class="data-label">Phone</span> <span class="data-value">${cust.phone || 'N/A'}</span></div>
                    <div class="data-row"><span class="data-label">City/State</span> <span class="data-value">${retailer.state || 'N/A'}</span></div>

                    <div class="section-title">📱 Device Specs</div>
                    <div class="data-row"><span class="data-label">Model</span> <span class="data-value">${deviceSpecs.Model || cust.model || 'N/A'}</span></div>
                    <div class="data-row"><span class="data-label">Brand</span> <span class="data-value">${deviceSpecs.Brand || 'N/A'}</span></div>
                    <div class="data-row"><span class="data-label">Android Ver</span> <span class="data-value">${deviceSpecs["Version Code"] || 'N/A'}</span></div>
                    <div class="data-row"><span class="data-label">IMEI</span> <span class="data-value">${cust.imei1 || 'N/A'}</span></div>

                    <div class="section-title">💰 Finance & Retailer</div>
                    <div class="data-row"><span class="data-label">Bank</span> <span class="data-value">${bank.name || 'N/A'}</span></div>
                    <div class="data-row"><span class="data-label">Retailer</span> <span class="data-value">${retailer.name || 'N/A'}</span></div>
                    <div class="data-row"><span class="data-label">EMI Amount</span> <span class="data-value">₹${cust.emi_amount || 0}</span></div>
                    
                    <div class="section-title">📅 EMI Schedule</div>
                    <div class="emi-table-wrapper">
                        <table class="mini-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                // LOOP THROUGH EMI ARRAY
                if (cust.emi && Array.isArray(cust.emi)) {
                    cust.emi.forEach(item => {
                        const statusClass = (item.status === 'Paid') ? 'status-paid' : 'status-unpaid';
                        html += `
                            <tr>
                                <td>${item.pay_on_date}</td>
                                <td>₹${item.amount}</td>
                                <td><span class="${statusClass}">${item.status}</span></td>
                            </tr>
                        `;
                    });
                } else {
                    html += `<tr><td colspan="3" style="text-align:center;">No EMI Records</td></tr>`;
                }

                html += `   </tbody></table></div>`;
                
                content.innerHTML = html;

            } catch (error) {
                console.error(error);
                content.innerHTML = `
                    <div style="text-align:center; color:#ef4444; padding:20px;">
                        <h3>❌ Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // --- 2. MODAL & FILTER LOGIC ---
        window.closeModal = function() {
            document.getElementById('infoModal').style.display = 'none';
        }
        window.onclick = function(event) {
            const modal = document.getElementById('infoModal');
            if (event.target == modal) modal.style.display = "none";
        }

        window.setFilter = function(status, btnElement) {
            window.currentStatusFilter = status;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            applyFilters();
        }

        window.applyFilters = function() {
            var input = document.getElementById("searchInput");
            var filterText = input.value.toUpperCase();
            var tr = document.getElementById("deviceTable").getElementsByTagName("tr");

            for (var i = 0; i < tr.length; i++) {
                var tdId = tr[i].getElementsByTagName("td")[0];
                if (tdId) {
                    var txtValue = tdId.textContent || tdId.innerText;
                    var textMatch = txtValue.toUpperCase().indexOf(filterText) > -1;
                    var rowStatus = tr[i].getAttribute('data-status'); 
                    var statusMatch = (window.currentStatusFilter === 'all') || (window.currentStatusFilter === rowStatus);

                    if (textMatch && statusMatch) tr[i].style.display = "";
                    else tr[i].style.display = "none";
                }
            }
        }

        // --- 3. LOCK/UNLOCK ACTIONS (RENAMED) ---
        window.toggleStatus = function(deviceId, currentStatus) {
            const newStatus = !currentStatus; 
            
            // ✅ RENAMED ALERT TEXT
            const actionName = newStatus ? "Activate-Restriction 🔒" : "Deactivate-Restriction 🔓";
            
            if(confirm(`Confirm: ${actionName} for Device ${deviceId}?`)) {
                update(ref(db, DB_PATH_NAME + '/' + deviceId), { isActiveRestriction: newStatus })
                .catch((e) => alert(e.message));
            }
        };

        // --- 4. FIREBASE REALTIME MONITOR ---
        function startMonitor() {
            onValue(ref(db, DB_PATH_NAME), (snapshot) => {
                if (snapshot.exists()) {
                    let total = 0, locked = 0, unlocked = 0, htmlCode = "";
                    snapshot.forEach((child) => {
                        total++;
                        const userId = child.key;
                        const data = child.val();
                        const isRestricted = data.isActiveRestriction === true; 
                        
                        if (isRestricted) locked++; else unlocked++;

                        // ✅ RENAMED STATUS & BUTTONS
                        const badgeClass = isRestricted ? "badge-locked" : "badge-open";
                        const badgeText = isRestricted ? "RESTRICTED" : "ACTIVE"; // "LOCKED" -> "RESTRICTED"
                        
                        const btnClass = isRestricted ? "btn-unlock" : "btn-lock";
                        // "Unlock" -> "Deactivate-Restriction" | "Lock" -> "Activate-Restriction"
                        const btnText = isRestricted ? "Deactivate-Restriction" : "Activate-Restriction";
                        const statusTag = isRestricted ? "locked" : "active";

                        htmlCode += `
                            <tr data-status="${statusTag}">
                                <td>
                                    <div style="font-weight:600; color:#fff; font-size:1.1rem;">${userId}</div>
                                </td>
                                <td>
                                    <span class="badge ${badgeClass}"><div class="dot"></div> ${badgeText}</span>
                                </td>
                                <td>
                                    <button class="btn btn-info" onclick="window.fetchUserInfo('${userId}')">
                                        👁️ Info
                                    </button>
                                    <button class="btn ${btnClass}" onclick="window.toggleStatus('${userId}', ${isRestricted})">
                                        ${isRestricted ? '🔓' : '🛡️'} ${btnText}
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                    document.getElementById("totalCount").innerText = total;
                    document.getElementById("lockedCount").innerText = locked;
                    document.getElementById("unlockedCount").innerText = unlocked;
                    document.getElementById("userTableBody").innerHTML = htmlCode;
                    applyFilters(); 
                } else {
                    document.getElementById("totalCount").innerText = "0";
                    document.getElementById("userTableBody").innerHTML = "<tr><td colspan='3' style='text-align:center; padding:30px; color:#94a3b8;'>No Devices Found</td></tr>";
                }
            });
        }
        startMonitor();
    </script>
</body>
</html>
