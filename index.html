<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EMI Admin Pro | Enterprise Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- 1. CORE VARIABLES --- */
        :root {
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-dark: #111827;
            --text-light: #6b7280;
            --border-color: #e5e7eb;
            --success-bg: #dcfce7;
            --success-text: #166534;
            --danger-bg: #fee2e2;
            --danger-text: #991b1b;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-dark);
            margin: 0; padding: 20px;
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        /* --- HEADER --- */
        .header-section { margin-bottom: 30px; }
        .header-title { font-size: 1.8rem; font-weight: 700; color: var(--text-dark); margin: 0; }
        .header-subtitle { color: var(--text-light); margin-top: 5px; font-size: 0.9rem; }

        /* --- STATS --- */
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px;
        }
        .stat-card {
            background: var(--bg-card); padding: 20px; border-radius: 12px;
            box-shadow: var(--shadow-sm); border: 1px solid var(--border-color);
        }
        .stat-label { font-size: 0.8rem; font-weight: 600; color: var(--text-light); text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
        .stat-value { font-size: 2rem; font-weight: 700; color: var(--text-dark); margin-top: 8px; display: block; }
        .indicator { width: 8px; height: 8px; border-radius: 50%; }

        /* --- CONTROLS --- */
        .controls-wrapper {
            background: var(--bg-card); padding: 15px; border-radius: 12px;
            box-shadow: var(--shadow-sm); border: 1px solid var(--border-color);
            display: flex; flex-wrap: wrap; gap: 15px; justify-content: space-between; align-items: center;
            margin-bottom: 25px;
        }
        .search-box { flex: 1; min-width: 280px; position: relative; }
        .search-box input {
            width: 100%; padding: 12px 16px; padding-left: 40px;
            border: 1px solid var(--border-color); border-radius: 8px;
            font-size: 0.95rem; font-family: 'Inter', sans-serif;
        }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-light); }

        .filter-group { display: flex; gap: 5px; background: #f9fafb; padding: 4px; border-radius: 8px; border: 1px solid var(--border-color); }
        .filter-btn {
            padding: 8px 14px; border: none; background: transparent; cursor: pointer;
            border-radius: 6px; font-weight: 500; font-size: 0.85rem; color: var(--text-light);
        }
        .filter-btn.active { background: var(--bg-card); color: var(--primary); box-shadow: var(--shadow-sm); font-weight: 600; }

        /* --- TABLE --- */
        .table-container {
            background: var(--bg-card); border-radius: 12px; overflow: hidden;
            box-shadow: var(--shadow-md); border: 1px solid var(--border-color);
        }
        table { width: 100%; border-collapse: collapse; }
        thead { background: #f9fafb; border-bottom: 1px solid var(--border-color); }
        th { padding: 15px 20px; text-align: left; font-size: 0.75rem; font-weight: 600; color: var(--text-light); text-transform: uppercase; }
        td { padding: 18px 20px; border-bottom: 1px solid var(--border-color); font-size: 0.95rem; color: var(--text-dark); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }

        /* --- BADGES & BUTTONS --- */
        .badge { display: inline-flex; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .badge-active { background-color: var(--success-bg); color: var(--success-text); }
        .badge-restricted { background-color: var(--danger-bg); color: var(--danger-text); }
        
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 500;
            cursor: pointer; border: 1px solid transparent; gap: 6px;
        }
        .btn-outline { background-color: white; border-color: var(--border-color); color: var(--text-dark); }
        .btn-action-lock { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
        .btn-action-unlock { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }

        /* --- MODAL --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); z-index: 2000;
            justify-content: center; align-items: center; animation: fadeIn 0.2s;
        }
        .modal-card {
            background: var(--bg-card); width: 95%; max-width: 600px; height: 90vh;
            border-radius: 16px; box-shadow: var(--shadow-md); display: flex; flex-direction: column;
            animation: slideUp 0.3s;
        }
        .modal-header {
            padding: 15px 20px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; background: #fff;
        }
        .modal-title { font-size: 1.1rem; font-weight: 600; margin: 0; }
        .close-btn { background: none; border: none; font-size: 1.5rem; color: var(--text-light); }
        .modal-body { padding: 20px; overflow-y: auto; background: #f9fafb; flex: 1; }

        /* Info Sections */
        .info-section { background: #fff; border: 1px solid var(--border-color); border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .section-heading { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; color: var(--text-light); margin-bottom: 12px; border-bottom: 1px solid #f3f4f6; padding-bottom: 8px; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9rem; }
        .info-val { font-weight: 600; text-align: right; word-break: break-word; max-width: 60%; }

        /* Smart Elements */
        .map-btn-modern {
            display: flex; align-items: center; justify-content: center; width: 100%;
            padding: 12px; background-color: #eff6ff; color: #1d4ed8; 
            border: 1px solid #bfdbfe; border-radius: 8px; font-weight: 600; text-decoration: none;
        }
        .switch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
        .switch-badge {
            display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 6px;
            font-size: 0.75rem; font-weight: 500; background: #f3f4f6; color: var(--text-light);
        }
        .status-on { background-color: #22c55e; width:6px; height:6px; border-radius:50%; }
        .status-off { background-color: #ef4444; width:6px; height:6px; border-radius:50%; }
        .text-on { color: #15803d; background: #dcfce7; } 
        .text-off { color: #991b1b; background: #fee2e2; }

        /* EMI Table */
        .emi-table { width: 100%; font-size: 0.85rem; border-collapse: collapse; margin-top: 5px; }
        .emi-table th { text-align: left; padding: 8px; color: var(--text-light); border-bottom: 1px solid var(--border-color); }
        .emi-table td { padding: 8px; border-bottom: 1px solid #f3f4f6; }
        .emi-paid { color: #166534; font-weight: 600; } .emi-pending { color: #991b1b; font-weight: 600; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* =========================================
           📱 MOBILE RESPONSIVE MAGIC STARTS HERE
           ========================================= */
        @media (max-width: 768px) {
            body { padding: 12px; }
            
            /* Header */
            .header-title { font-size: 1.5rem; }
            .header-section { margin-bottom: 20px; }

            /* Controls */
            .controls-wrapper { flex-direction: column; align-items: stretch; gap: 12px; padding: 12px; }
            .search-box { min-width: 100%; }
            .filter-group { display: grid; grid-template-columns: 1fr 1fr 1fr; width: 100%; }
            .filter-btn { padding: 10px 5px; font-size: 0.8rem; text-align: center; }

            /* Table to Card Conversion */
            .table-container { background: transparent; border: none; box-shadow: none; overflow: visible; }
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; } /* Hide Header */

            tr {
                background: #fff; border-radius: 12px; margin-bottom: 15px;
                box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid var(--border-color);
                padding: 16px; position: relative;
            }

            td { 
                padding: 5px 0; border: none; display: flex; align-items: center; justify-content: space-between;
                font-size: 0.9rem;
            }

            /* 1. Device ID Row (Looks like a title) */
            td:nth-child(1) {
                display: block; padding-bottom: 10px; margin-bottom: 10px;
                border-bottom: 1px dashed var(--border-color);
            }
            td:nth-child(1) div:first-child { font-size: 1.1rem; color: var(--primary); }

            /* 2. Status Row */
            td:nth-child(2) { justify-content: flex-start; margin-bottom: 12px; }

            /* 3. Actions Row (Buttons Grid) */
            td:nth-child(3) {
                display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; padding-top: 5px;
            }
            td:nth-child(3) button { width: 100%; justify-content: center; padding: 10px; }

            /* Modal Full Screen */
            .modal-card { width: 100%; height: 100%; border-radius: 0; max-width: none; }
            .modal-header { padding-top: 20px; } /* Safe area for notches */
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header-section">
            <h1 class="header-title">Dashboard Overview</h1>
            <p class="header-subtitle">Live Device Management System</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label"><span class="indicator" style="background:#6366f1;"></span>Total Devices</span>
                <span class="stat-value" id="totalCount">...</span>
            </div>
            <div class="stat-card">
                <span class="stat-label"><span class="indicator" style="background:#ef4444;"></span>Restricted</span>
                <span class="stat-value" id="lockedCount" style="color:#ef4444;">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label"><span class="indicator" style="background:#22c55e;"></span>Active</span>
                <span class="stat-value" id="unlockedCount" style="color:#22c55e;">0</span>
            </div>
        </div>

        <div class="controls-wrapper">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" onkeyup="applyFilters()" placeholder="Search ID / Name / Phone">
            </div>
            <div class="filter-group">
                <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
                <button class="filter-btn" onclick="setFilter('locked', this)">Restricted</button>
                <button class="filter-btn" onclick="setFilter('active', this)">Active</button>
            </div>
        </div>

        <div class="table-container">
            <table id="deviceTable">
                <thead>
                    <tr>
                        <th width="35%">Identity</th>
                        <th width="20%">Status</th>
                        <th width="45%" style="text-align:right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr><td colspan="3" style="text-align:center; padding:50px; color:#9ca3af;">Loading Data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="infoModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h2 class="modal-title">Device Details</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modalBodyContent">
                </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC3_9rThlE6buWnVV7R292DYd9B0wgLJBI",
            authDomain: "divyanshglobal-ecommerce.firebaseapp.com",
            databaseURL: "https://divyanshglobal-ecommerce-default-rtdb.firebaseio.com",
            projectId: "divyanshglobal-ecommerce",
            storageBucket: "divyanshglobal-ecommerce.firebasestorage.app",
            messagingSenderId: "588680943243",
            appId: "1:588680943243:web:21d29cddde8274173f268e",
            measurementId: "G-ZDEM4XHEBV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const DB_PATH_NAME = 'device'; 

        window.currentStatusFilter = 'all';

        // --- FETCH USER INFO ---
        window.fetchUserInfo = async function(deviceId) {
            const modal = document.getElementById('infoModal');
            const content = document.getElementById('modalBodyContent');
            
            modal.style.display = 'flex';
            content.innerHTML = `<div style="text-align:center; padding:80px 0; color:#6b7280;">
                                    <div style="font-size:2rem; margin-bottom:10px;">⏳</div>
                                    <div>Fetching Details...</div>
                                 </div>`;

            try {
                const apiUrl = `https://login.emitrackon.in/api/get/hidden_app/send-device-info/${deviceId}`;
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error("API Error");

                const rawData = await response.json();
                if (!rawData || !rawData.customer) throw new Error("No Data");

                const c = rawData.customer; 
                const r = c.retailer || {};
                const b = c.bank || {};
                const act = c.action || {};

                // Parse Device Specs
                let dSpecs = {};
                try { dSpecs = JSON.parse(c.device_detail || '{}'); } catch (e) {}

                // --- 📍 MOBILE SMART ADDRESS ---
                let mapQuery = "";
                if (c.latitude && c.longitude) {
                    mapQuery = `${c.latitude},${c.longitude}`;
                } else if (r.address) {
                    let words = r.address.split(' ');
                    mapQuery = encodeURIComponent(words.length > 4 ? words.slice(4).join(' ') : r.address);
                }
                const mapLink = `https://www.google.com/maps/search/?api=1&query=${mapQuery}`;

                let html = `
                    <div class="info-section">
                        <div class="section-heading">Profile</div>
                        <div class="info-row"><span class="info-label">Name</span> <span class="info-val">${c.name || '-'}</span></div>
                        <div class="info-row"><span class="info-label">Phone</span> <span class="info-val"><a href="tel:${c.phone}" style="text-decoration:none; color:inherit;">${c.phone || '-'}</a></span></div>
                        <div class="info-row"><span class="info-label">Loan ID</span> <span class="info-val">${c.subscription_id || '-'}</span></div>
                    </div>

                    <div class="info-section">
                        <div class="section-heading">Location</div>
                        <a href="${mapLink}" target="_blank" class="map-btn-modern">
                            <span>📍</span> Open in Google Maps
                        </a>
                    </div>

                    <div class="info-section">
                        <div class="section-heading">Finance</div>
                        <div class="info-row"><span class="info-label">Price</span> <span class="info-val">₹${c.product_price || 0}</span></div>
                        <div class="info-row"><span class="info-label">EMI</span> <span class="info-val" style="color:var(--primary);">₹${c.emi_amount || 0}</span></div>
                        <div class="info-row"><span class="info-label">Bank</span> <span class="info-val">${b.name || '-'}</span></div>
                    </div>

                    <div class="info-section">
                        <div class="section-heading">Policies</div>
                        <div class="switch-grid">`;
                
                for (const [key, item] of Object.entries(act)) {
                    let isOn = item.value === true;
                    let badgeClass = isOn ? 'text-on' : 'text-off';
                    let dotClass = isOn ? 'status-on' : 'status-off';
                    html += `<div class="switch-badge ${badgeClass}"><div class="${dotClass}"></div>${item.display}</div>`;
                }
                html += `</div></div>`;

                html += `<div class="info-section">
                            <div class="section-heading">Device</div>
                            <div class="info-row"><span class="info-label">Model</span> <span class="info-val">${dSpecs.Model || c.model}</span></div>
                            <div class="info-row"><span class="info-label">IMEI</span> <span class="info-val" style="font-size:0.8rem">${c.imei1 || '-'}</span></div>
                         </div>`;

                html += `
                    <div class="info-section">
                        <div class="section-heading">Schedule</div>
                        <table class="emi-table">
                            <thead><tr><th>Date</th><th>Amt</th><th style="text-align:right;">Status</th></tr></thead>
                            <tbody>`;
                
                if (c.emi && Array.isArray(c.emi)) {
                    c.emi.forEach(e => {
                        let statusClass = e.status === 'Paid' ? 'emi-paid' : 'emi-pending';
                        html += `<tr><td>${e.pay_on_date}</td><td>₹${e.amount}</td><td style="text-align:right;"><span class="${statusClass}">${e.status}</span></td></tr>`;
                    });
                } else { html += `<tr><td colspan="3" style="text-align:center;">No records</td></tr>`; }
                
                html += `</tbody></table></div>`;
                content.innerHTML = html;

            } catch (error) {
                console.error(error);
                content.innerHTML = `<div style="text-align:center; color:#ef4444; padding:40px;"><h3>Failed</h3><p>${error.message}</p></div>`;
            }
        }

        window.closeModal = function() { document.getElementById('infoModal').style.display = 'none'; }
        window.onclick = function(e) { if (e.target == document.getElementById('infoModal')) closeModal(); }
        
        window.setFilter = function(s, b) {
            window.currentStatusFilter = s;
            document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            applyFilters();
        }

        window.applyFilters = function() {
            let val = document.getElementById("searchInput").value.toUpperCase();
            let trs = document.getElementById("deviceTable").getElementsByTagName("tr");
            for (let tr of trs) {
                let td = tr.getElementsByTagName("td")[0];
                if (td) {
                    let txt = td.innerText.toUpperCase();
                    let stat = tr.getAttribute('data-status');
                    let show = (window.currentStatusFilter === 'all' || window.currentStatusFilter === stat) && txt.indexOf(val) > -1;
                    tr.style.display = show ? "" : "none";
                }
            }
        }

        window.toggleStatus = function(id, current) {
            let next = !current;
            let action = next ? "Activate Restriction" : "Remove Restriction";
            if(confirm(`Confirm: ${action} for Device ${id}?`)) {
                update(ref(db, DB_PATH_NAME + '/' + id), { isActiveRestriction: next }).catch(e => alert(e.message));
            }
        };

        function startMonitor() {
            onValue(ref(db, DB_PATH_NAME), (snap) => {
                if (snap.exists()) {
                    let tot=0, lck=0, unl=0, h="";
                    snap.forEach(c => {
                        tot++;
                        let d = c.val(), id = c.key;
                        let isRes = d.isActiveRestriction === true;
                        if(isRes) lck++; else unl++;
                        
                        let badgeClass = isRes ? "badge-restricted" : "badge-active";
                        let bTxt = isRes ? "Restricted" : "Active";
                        let btnCls = isRes ? "btn-action-unlock" : "btn-action-lock";
                        let btnTxt = isRes ? "Deactivate" : "Activate"; 
                        let btnIcon = isRes ? "🔓" : "🛡️";
                        let tag = isRes ? "locked" : "active";

                        h += `<tr data-status="${tag}">
                            <td>
                                <div style="font-weight:700; color:var(--text-dark);">${id}</div>
                                <div style="font-size:0.8rem; color:var(--text-light);">ID</div>
                            </td>
                            <td><span class="badge ${badgeClass}">${bTxt}</span></td>
                            <td style="text-align:right;">
                                <button class="btn btn-outline" onclick="window.fetchUserInfo('${id}')">Info</button>
                                <button class="btn ${btnCls}" onclick="window.toggleStatus('${id}', ${isRes})">${btnIcon} ${btnTxt}</button>
                            </td>
                        </tr>`;
                    });
                    document.getElementById("totalCount").innerText = tot;
                    document.getElementById("lockedCount").innerText = lck;
                    document.getElementById("unlockedCount").innerText = unl;
                    document.getElementById("userTableBody").innerHTML = h;
                    applyFilters();
                } else {
                    document.getElementById("userTableBody").innerHTML = "<tr><td colspan='3' style='text-align:center; padding:40px;'>No devices found.</td></tr>";
                }
            });
        }
        startMonitor();
    </script>
</body>
</html>
